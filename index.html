<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michal Horáček</title>
<meta name="description" content="Portfolio: photography, carpentry, joinery, gardening, landscape care, arboriculture.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--moss:#2d5a3d;--leaf:#8bd346;--oak:#b9763f;--walnut:#3b2417;--sun:#ffc233;--birch:#f4f8ee;--ink:#1f2a22}
*{box-sizing:border-box}
html{scroll-padding-top:64px}
body{margin:0;font:1.0625rem/1.6 Figtree,system-ui,sans-serif;background:var(--birch);color:var(--ink)}
h1,h2,h3,h4{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;line-height:1.05;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 1.25rem}
header{position:sticky;top:0;z-index:5;background:var(--walnut);color:var(--birch)}
header .wrap{display:flex;gap:.5rem 1rem;align-items:center;justify-content:space-between;flex-wrap:wrap;min-height:56px;padding-top:.4rem;padding-bottom:.4rem}
nav.top{display:flex;gap:.3rem 1.1rem;flex-wrap:wrap;font-size:.95rem}
nav.top a{text-decoration:none;padding:.2rem 0;border-bottom:2px solid transparent}
nav.top a:hover{border-color:var(--leaf)}
.lang{display:flex;gap:.35rem}
.lang button{font:inherit;font-size:.85rem;padding:.2rem .65rem;border-radius:99px;border:2px solid var(--leaf);background:transparent;color:var(--birch);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--leaf);color:var(--walnut);font-weight:600}
.hero{background:var(--walnut);color:var(--birch);padding:4rem 0}
.hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;align-items:center}
.hero h1{font-size:clamp(3rem,8vw,6.5rem);font-weight:800;letter-spacing:-.02em}
.hero p{max-width:34ch;font-size:1.25rem;margin:1.5rem 0 0;color:var(--leaf)}
.hero .hint{font-size:.95rem;color:var(--birch);opacity:.85;margin-top:1rem}
.rings{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}
.rings a{cursor:pointer;outline:none}
.rings .fo{opacity:0;pointer-events:none;transition:opacity .2s}
.rings a:hover .fo{opacity:.3}
.rings a:focus-visible .fo{opacity:.55}
nav.top a.hl{border-color:var(--leaf)}
nav.top a[aria-current]{border-color:var(--leaf)}
nav.top a[aria-current]::before{content:"✓ "}
.rings a.hl .fo{opacity:.3}
.rings a[aria-current] .fo{opacity:.55}
.rings text{font:600 15px Figtree,system-ui,sans-serif;pointer-events:none}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}}
section{padding:5rem 0}
section h2{font-size:clamp(2rem,5vw,3.4rem);margin-bottom:.75rem}
h3{font-size:clamp(1.5rem,3.5vw,2rem);margin-bottom:.75rem}
h4{font-size:1.2rem;margin:1.25rem 0 .75rem}
.lead{max-width:60ch;margin:0 0 1.5rem}
.panel{padding:2rem;border-radius:32px 8px 32px 8px;margin-top:1.75rem}
.panel:nth-of-type(even){border-radius:8px 32px 8px 32px}
.p-photo{background:#e3f4cd}
.p-wood{background:#f0dcc2}
.p-tree{background:var(--moss);color:var(--birch)}
.p-garden{background:#fff0c0}
#training{background:#e3f4cd}
#fascinations{background:var(--moss);color:var(--birch)}
.ph{display:grid;place-items:center;text-align:center;min-height:220px;padding:1.5rem;border:3px dashed currentColor;border-radius:28px 6px 28px 6px;opacity:.85;font-weight:600}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.25rem}
.gallery figure{margin:0}
.gallery img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:28px 6px 28px 6px}
.gallery figure:nth-child(even) img{border-radius:6px 28px 6px 28px}
.gallery figure:nth-child(even){margin-top:1.5rem}
.gallery figcaption{margin-top:.5rem;font-size:.95rem}
.tl{list-style:none;margin:2rem 0 0;padding:0 0 0 1.5rem;border-left:4px solid var(--oak)}
.tl li{position:relative;padding:0 0 1.6rem 1rem;display:grid;grid-template-columns:9.5rem 1fr;gap:.25rem 1.25rem}
.tl li::before{content:"";position:absolute;left:-2.1rem;top:.45rem;width:14px;height:14px;border-radius:50%;background:var(--sun);border:3px solid var(--oak)}
.tl time{font-weight:600;color:#7a4a21}
.tl b{display:block;font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:1.2rem}
@media (max-width:620px){.tl li{grid-template-columns:1fr}}
#education{background:#f0dcc2}
#career{background:var(--birch)}
#contact{background:var(--walnut);color:var(--birch)}
footer{background:var(--ink);color:var(--birch);padding:1.5rem 0;font-size:.9rem}
.motto{margin:1.5rem 0 0;max-width:34ch;padding-left:1rem;border-left:4px solid var(--sun);font:italic 500 1.25rem/1.4 "Bricolage Grotesque",Figtree,sans-serif;color:var(--leaf)}
.hero .intro{max-width:46ch;margin:1.25rem 0 0;font-size:1.1rem;color:var(--birch)}
.school{background:#fff;border-radius:28px 6px 28px 6px;padding:1.75rem;margin-top:1.5rem}
.school:nth-of-type(even){border-radius:6px 28px 6px 28px}
.school ul{margin:.75rem 0 0;padding-left:1.2rem}
.school li{margin:.3rem 0}
.note{max-width:60ch;margin:1.5rem 0 0;font-size:1.1rem}
.chipsf{display:flex;flex-wrap:wrap;gap:.6rem;list-style:none;margin:1.5rem 0 0;padding:0}
.chipsf li{padding:.5rem 1.1rem;border-radius:99px;font-weight:600;color:var(--ink)}
.chipsf li:nth-child(5n+1){background:var(--leaf)}.chipsf li:nth-child(5n+2){background:var(--sun)}.chipsf li:nth-child(5n+3){background:#e8c89a}.chipsf li:nth-child(5n+4){background:#6fbf8b}.chipsf li:nth-child(5n+5){background:var(--birch)}
</style>
</head>
